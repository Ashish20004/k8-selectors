apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-autoscalar
  namespace: roboshop
  labels:
    name: roboshop
    environment: dev
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      name: roboshop
      environment: dev
      component: backend
  template:
    metadata:
      labels:
        name: roboshop
        environment: dev
        component: backend
    spec:
      containers:
      - name: catalogue
        image: devzonefun/catalogue:2.0.0
        imagePullPolicy: Always
      resources:
        requests:
          cpu: 100m
          memory: 128mi
        limits:
          cpu: 150m
          memory: 256mi
        volumesmounts:
          - name: volume1
            path: /var/log/catalogue
---
apiversion: v1
kind: Service
metadata:
  name: catalogue
  labels:
    name: roboshop
    environment: dev
    component: backend
spec:
  selector:
    name: roboshop
    environment: dev
    component: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
      